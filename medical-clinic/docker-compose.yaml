version: '3'
services:
  app:
    build: .
    container_name: 'medical-clinic-app'
    depends_on:
      - 'postgres-db'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/medical-db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
    ports:
      - '8080:8080'
    networks:
      - my-network
  proxy:
    image: medical-clinic-proxy
    container_name: 'medical-clinic-proxy'
    environment:
      - MEDICAL_CLINIC_API_URL=http://app:8080
    ports:
      - '8082:8082'
    networks:
      - my-network
  postgres-db:
    image: postgres
    container_name: 'postgres'
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pass'
      POSTGRES_DB: 'medical-db'
    ports:
      - '5431:5432'
    networks:
      - my-network
  pgadmin_service:
    image: dpage/pgadmin4
    container_name: my-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: giljr.2009@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "15432:80"
    networks:
      - my-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-db_secret_change_me}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    networks:
      - kc-net
  keycloak:
    image: quay.io/keycloak/keycloak:25.0 # LTS version
    command: start-dev # DEV ONLY! Produkcja: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-db_secret_change_me}
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    # Produkcja: dodaj KC_HOSTNAME_STRICT=true, KC_HTTPS_*
    ports:
      - "8180:8180"
    depends_on:
      - keycloak-db
    networks:
      - kc-net

networks:
  my-network:
    driver: bridge
  kc-net:

volumes:
  pgadmin-data:
  keycloak_pgdata: